# The single front door.
#
# Everything a browser touches — the PWA, the public map, the panel and every
# API call — arrives on ONE origin and one port. Nothing else is published.
#
#   /            -> web  (Next.js standalone, :3000)
#   /api/...     -> api  (Fastify, :8080), the /api prefix stripped
#
# Why one door and not two published ports:
#   - one origin means no CORS and no preflight on the intake POST. A family on
#     a bad cell network pays one DNS lookup and one TLS handshake, not two.
#   - the API's address never reaches a browser, so moving the API is an edge
#     config change, not a client rebuild.
#   - it is the only place where request size, timeouts and the client-IP
#     header are decided. Two published ports means two answers to each.

# "Connection: upgrade" only when the client actually asked for an upgrade;
# otherwise keep the connection alive. Hard-coding "upgrade" breaks keepalive
# for every ordinary request.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream rh_web {
  server web:3000;
  keepalive 16;
}

upstream rh_api {
  server api:8080;
  keepalive 16;
}

# Cache the resolver-free upstream names: compose DNS is stable for the life of
# the container, and a hard failure here should be loud, not silently retried.

server {
  listen 80;
  server_name _;

  # A photo is the reason this number is not 1m. The API rejects above
  # PHOTO_MAX_BYTES (3 MiB) with a message a person can read; nginx must not cut
  # the upload first with a bare 413, because that failure looks like "the site
  # is broken" rather than "this picture is too big".
  client_max_body_size 8m;
  client_body_timeout 60s;

  # Do not advertise the version to the open internet.
  server_tokens off;

  # Logs carry the real client address, not the container's.
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # --- Liveness of the edge itself ---------------------------------------
  # Deliberately answered by nginx and not proxied: it says "the front door is
  # open", which is a different question from "the API is ready". /api/readyz
  # answers the second one.
  location = /edge-health {
    access_log off;
    add_header content-type text/plain always;
    return 200 "edge ok\n";
  }

  # --- API ----------------------------------------------------------------
  # The trailing slash on proxy_pass strips the /api prefix: the API keeps its
  # own routes (/v1/..., /readyz) and knows nothing about the prefix.
  location /api/ {
    proxy_pass http://rh_api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # The API runs with trustProxy enabled so rate limiting sees the real
    # caller. That makes these headers security-relevant: we OVERWRITE them
    # with what nginx observed instead of appending to whatever the client
    # sent. Appending would let anyone prepend an address and shed their own
    # rate limit — and this is a public intake form on the open internet.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # An intake POST must not be silently retried against another upstream:
    # the request carries a device uuid for idempotency, but a retry after a
    # partial upload is still wasted bandwidth on a saturated network.
    proxy_next_upstream off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
  }

  # --- PWA ----------------------------------------------------------------
  location / {
    proxy_pass http://rh_web;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Next.js uses an upgrade for dev HMR and for streaming responses.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
