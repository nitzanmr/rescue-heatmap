# The single front door.
#
# Everything a browser touches — the PWA, the public map, the panel and every
# API call — arrives on ONE origin and one port. Nothing else is published.
#
#   /            -> web  (Next.js standalone, :3000)
#   /api/...     -> api  (Fastify, :8080), the /api prefix stripped
#
# Why one door and not two published ports:
#   - one origin means no CORS and no preflight on the intake POST. A family on
#     a bad cell network pays one DNS lookup and one TLS handshake, not two.
#   - the API's address never reaches a browser, so moving the API is an edge
#     config change, not a client rebuild.
#   - it is the only place where request size, timeouts and the client-IP
#     header are decided. Two published ports means two answers to each.

# "Connection: upgrade" only when the client actually asked for an upgrade;
# otherwise keep the connection alive. Hard-coding "upgrade" breaks keepalive
# for every ordinary request.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream rh_web {
  server web:3000;
  keepalive 16;
}

# --- The public read cache -------------------------------------------------
#
# Two endpoints answer the SAME bytes to every caller on earth: the aggregated
# heat layer and the aid-site layer. Both are recomputed from the database on
# every request (heat_cells() transforms every indexed person into a metre grid),
# and during an activation thousands of phones ask for them at once. So they are
# cached HERE, once, for everyone.
#
# Why this is not a general-purpose cache: it is opt-in per location, and only
# the two aggregate endpoints opt in. Everything about a named person — search,
# the shared card, media bytes — carries `Cache-Control: no-store` from the API
# and must never be stored on this box. nginx honours no-store, but we do not
# rely on that: those paths simply never reach a `proxy_cache` directive.
#
# In RAM, not on disk (see the tmpfs in docker-compose.yml): a cached answer
# outliving the container on a laptop or a rented VM is a liability we get
# nothing for.
proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=rh_public:10m
                 max_size=64m inactive=10m use_temp_path=off;

# The cache key (set per location below) deliberately excludes the client: same
# URL, same answer for everyone. It includes the query string, because ?cell=
# and ?kinds= change the answer.

# Compress before it leaves the building. A heat response is a few hundred JSON
# objects and the aid-site layer is 108 sites with names and phone numbers —
# both are 70-85% air. The audience is on a congested cellular network, which
# is exactly where the bytes we do not send are the ones that arrive fastest.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json application/javascript
           text/css text/plain text/xml image/svg+xml;

upstream rh_api {
  server api:8080;
  keepalive 16;
}

# Cache the resolver-free upstream names: compose DNS is stable for the life of
# the container, and a hard failure here should be loud, not silently retried.

server {
  listen 80;
  server_name _;

  # A photo is the reason this number is not 1m. The API rejects above
  # PHOTO_MAX_BYTES (3 MiB) with a message a person can read; nginx must not cut
  # the upload first with a bare 413, because that failure looks like "the site
  # is broken" rather than "this picture is too big".
  client_max_body_size 8m;
  client_body_timeout 60s;

  # Do not advertise the version to the open internet.
  server_tokens off;

  # Logs carry the real client address, not the container's.
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # --- Liveness of the edge itself ---------------------------------------
  # Deliberately answered by nginx and not proxied: it says "the front door is
  # open", which is a different question from "the API is ready". /api/readyz
  # answers the second one.
  location = /edge-health {
    access_log off;
    add_header content-type text/plain always;
    return 200 "edge ok\n";
  }

  # --- The two cached public layers ---------------------------------------
  # `location =` is exact-match and wins over the `/api/` prefix below, so these
  # two URLs — and nothing that merely starts with them — take the cached path.
  #
  # What each directive buys:
  #   proxy_cache_valid 200 30s   the map is a situational picture, not a ticker.
  #                               30s of staleness is invisible to a human and
  #                               removes ~99% of the database work under load.
  #   proxy_cache_lock            one request recomputes, the rest wait for it.
  #                               Without it, a cold cache under load sends every
  #                               concurrent miss to the database at once — the
  #                               stampede that turns a slow query into an outage.
  #   use_stale updating/error/timeout/5xx/429
  #                               THE POINT OF THE WHOLE THING: when the API is
  #                               down, overloaded or rate-limiting, the map keeps
  #                               drawing the last good answer instead of going
  #                               blank. A blank map reads as "no one is missing
  #                               here", which is the worst lie this system can
  #                               tell.
  #   background_update           the person who arrives after expiry is served
  #                               immediately; the refresh happens behind them.
  location = /api/v1/public/heat {
    proxy_pass http://rh_api/v1/public/heat$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    proxy_cache rh_public;
    proxy_cache_key "$request_method|$uri|$args";
    proxy_cache_valid 200 30s;
    proxy_cache_valid 404 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504 http_429;
    proxy_cache_background_update on;
    # An operator debugging "is the map stale?" must be able to see the answer.
    add_header X-Cache-Status $upstream_cache_status always;
  }

  location = /api/v1/public/aid-sites {
    proxy_pass http://rh_api/v1/public/aid-sites$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    proxy_cache rh_public;
    proxy_cache_key "$request_method|$uri|$args";
    # Shelters open and close in minutes, not seconds, and this layer is far
    # more expensive to build than it is to be right about to the second.
    proxy_cache_valid 200 120s;
    proxy_cache_valid 404 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504 http_429;
    proxy_cache_background_update on;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # --- API ----------------------------------------------------------------
  # The trailing slash on proxy_pass strips the /api prefix: the API keeps its
  # own routes (/v1/..., /readyz) and knows nothing about the prefix.
  location /api/ {
    proxy_pass http://rh_api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # The API runs with trustProxy enabled so rate limiting sees the real
    # caller. That makes these headers security-relevant: we OVERWRITE them
    # with what nginx observed instead of appending to whatever the client
    # sent. Appending would let anyone prepend an address and shed their own
    # rate limit — and this is a public intake form on the open internet.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # An intake POST must not be silently retried against another upstream:
    # the request carries a device uuid for idempotency, but a retry after a
    # partial upload is still wasted bandwidth on a saturated network.
    proxy_next_upstream off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
  }

  # --- PWA ----------------------------------------------------------------
  location / {
    proxy_pass http://rh_web;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Next.js uses an upgrade for dev HMR and for streaming responses.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
