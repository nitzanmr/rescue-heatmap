# Local development and the drill. `docker compose up` must produce a database
# with our schema and an API that accepts a report — with no cloud account, no
# credit card and no network beyond the image pull.
#
#   docker compose up -d db
#   docker compose run --rm migrate
#   docker compose run --rm seed
#   docker compose up api worker web edge
#
# ONE published port: the edge (nginx) on EDGE_PORT, 8080 by default. The API
# and the PWA are reachable only through it, on one origin:
#   http://localhost:8080/          -> the PWA
#   http://localhost:8080/api/...   -> the API
# The database port stays published because the correlation test runs on the
# host and must reach it directly.
#
# The db image is built locally because no official image carries both PostGIS
# and pgvector, and our correlation query needs both in the same statement.
name: rescue-heatmap

services:
  db:
    # Postgres 17 + PostGIS 3.5 + pgvector 0.8.6. 17 and not 18 on purpose: 18 is
    # Preview on Cloud SQL and absent on Supabase, and this image exists to match
    # the managed target, not to be the newest. See ops/dev/Dockerfile.db.
    build:
      context: ./ops/dev
      dockerfile: Dockerfile.db
    image: rescue-db:dev
    environment:
      POSTGRES_USER: rescue
      POSTGRES_PASSWORD: rescue
      POSTGRES_DB: rescue
      # Fail fast on a mis-set locale: Spanish text search depends on it.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./ops/dev/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rescue -d rescue"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Memory settings are stated, not defaulted, and they are overridable per
    # machine: the same compose file runs on a 4 GB VM and on a 16 GB one, and
    # Postgres' out-of-the-box 128 MB of shared_buffers wastes either.
    #   PG_SHARED_BUFFERS=4GB PG_EFFECTIVE_CACHE=12GB PG_WORK_MEM=32MB make up
    # max_connections is deliberately NOT 200 any more. Our two pools ask for
    # 8+8; a limit of 200 on a small box is not headroom, it is permission to
    # OOM (each backend costs MBs before it does any work).
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-2GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - shared_preload_libraries=pg_stat_statements

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: rescue-api:dev
    environment:
      ROLE: migrate
      NODE_ENV: development
      # The local database speaks plaintext on a private compose network. Say so
      # explicitly -- the code never guesses TLS from a hostname.
      DB_SSL: disable
      DATABASE_URL: postgres://rescue:rescue@db:5432/rescue
      DATABASE_DIRECT_URL: postgres://rescue:rescue@db:5432/rescue
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      # Build-time network. `default` everywhere; `host` only on a machine whose
      # docker build network cannot resolve DNS (a systemd-resolved host we hit
      # during a drill). That workaround belongs to that machine, not to this
      # repository: `host` is unsupported on some builders (Docker Desktop,
      # rootless), so baking it in as the default breaks everyone else.
      #   BUILD_NETWORK=host make drill
      network: ${BUILD_NETWORK:-default}
    image: rescue-api:dev
    environment:
      ROLE: api
      NODE_ENV: development
      PORT: 8080
      # The local database speaks plaintext on a private compose network. Say so
      # explicitly -- the code never guesses TLS from a hostname.
      DB_SSL: disable
      DATABASE_URL: postgres://rescue:rescue@db:5432/rescue
      DATABASE_DIRECT_URL: postgres://rescue:rescue@db:5432/rescue
      # Development-only peppers. Rotating these in production invalidates every
      # family's private link — they are durable secrets, not config.
      TOKEN_PEPPER: dev-token-pepper-change-me
      IP_PEPPER: dev-ip-pepper-change-me
      CORS_ORIGINS: "*"
      STORAGE_DRIVER: fs
      STORAGE_ROOT_DIR: /data/media
      LOG_LEVEL: info
    # No published port on purpose. The API is reached through the edge at
    # /api/... — one origin for the whole system. Publishing it again would
    # create a second way in that bypasses the edge's request-size limit and,
    # worse, its X-Forwarded-For overwrite: this service runs with trustProxy
    # on, so a directly reachable port is a client-IP spoofing hole.
    expose:
      - "8080"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: rescue-api:dev
    environment:
      ROLE: worker
      NODE_ENV: development
      # The local database speaks plaintext on a private compose network. Say so
      # explicitly -- the code never guesses TLS from a hostname.
      DB_SSL: disable
      DATABASE_URL: postgres://rescue:rescue@db:5432/rescue
      TOKEN_PEPPER: dev-token-pepper-change-me
      IP_PEPPER: dev-ip-pepper-change-me
      STORAGE_DRIVER: fs
      STORAGE_ROOT_DIR: /data/media
      WORKER_CONCURRENCY: 2
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The PWA. The browser reaches it through the edge; /api on the same origin is
  # routed to the API by nginx, so the browser never needs the API's address and
  # there is no CORS in the intake path.
  web:
    build:
      context: ./app/web
      network: ${BUILD_NETWORK:-default}
    image: rescue-web:dev
    environment:
      NODE_ENV: production
      # Server-side: where Next forwards /api/* and where it fetches link-preview
      # metadata from. Container address, never seen by a browser.
      API_ORIGIN: http://api:8080
      # The address a human types and a shared link contains: the edge, not this
      # container. Anything else prints an unreachable link on a family's card.
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${EDGE_PORT:-8080}}
    expose:
      - "3000"
    depends_on:
      - api

  # Synthetic incident + reports with known duplicates. This is what makes the
  # correlation weights measurable instead of a guess.
  seed:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: rescue-api:dev
    environment:
      NODE_ENV: development
      # The local database speaks plaintext on a private compose network. Say so
      # explicitly -- the code never guesses TLS from a hostname.
      DB_SSL: disable
      DATABASE_URL: postgres://rescue:rescue@db:5432/rescue
      TOKEN_PEPPER: dev-token-pepper-change-me
      IP_PEPPER: dev-ip-pepper-change-me
      SEED_CASES: "${SEED_CASES:-500}"
      # Queue every seeded case for the worker: the drill must exercise the real
      # asynchronous path. In-process callers (the correlation test) leave this
      # unset so a running worker cannot race their measurement.
      SEED_ENQUEUE: "1"
    command: ["node", "dist/seed.js"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  # The single front door. Every browser request — page or API — arrives here.
  # See ops/edge/nginx.conf for why there is one origin and not two ports.
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./ops/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # The public read cache lives in RAM and dies with the container. It holds
    # only the two aggregate layers (no named person ever reaches it), and a
    # cache surviving a restart on someone's laptop buys us nothing.
    tmpfs:
      - /var/cache/nginx:size=96m,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/edge-health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - api
      - web

volumes:
  dbdata:
  media:
